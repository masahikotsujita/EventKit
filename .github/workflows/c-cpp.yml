name: C/C++ CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: build
      run: |
        mkdir cmake-build-debug
        cd cmake-build-debug
        cmake .. -DEVENTKIT_BUILD_TESTS=true
        make
    - name: test
      run: |
        cd cmake-build-debug
        ./test/eventkittest -s
      timeout-minutes: 5

    - name: build-coroutine
      run: |
        mkdir cmake-build-debug-coroutine
        cd cmake-build-debug-coroutine
        cmake .. -DEVENTKIT_BUILD_TESTS=true -DEVENTKIT_ENABLE_COROUTINE=true
        make
    - name: test-coroutine
      run: |
        cd cmake-build-debug-coroutine
        ./test/eventkittest -s
      timeout-minutes: 5
