name: Run Tests

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: build tests
      run: |
        mkdir cmake-build-test
        cd cmake-build-test
        cmake .. -DEVENTKIT_BUILD_TESTS=true
        make
    - name: run tests
      run: |
        cd cmake-build-test
        ./tests/eventkittest -s
      timeout-minutes: 5

    - name: build tests with coroutines
      run: |
        mkdir cmake-build-test-with-coroutines
        cd cmake-build-test-with-coroutines
        cmake .. -DEVENTKIT_BUILD_TESTS=true -DEVENTKIT_ENABLE_COROUTINE=true
        make
    - name: run tests with coroutine
      run: |
        cd cmake-build-test-with-coroutines
        ./tests/eventkittest -s
      timeout-minutes: 5
